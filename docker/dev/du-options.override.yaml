services:
  oai-du:
    image: oai-gnb-nxp:latest
    environment:
      USE_ADDITIONAL_OPTIONS: >-
        --thread-pool 9,10,15
        --loader.ldpc.shlibversion _aal
        --nrLDPC_coding_aal.dpdk_dev baseband_la12xx0
        --nrLDPC_coding_aal.dpdk_core_list 0
        --log_config.global_log_options level,nocolor,utc_time
        -q
        --chest-time 1
